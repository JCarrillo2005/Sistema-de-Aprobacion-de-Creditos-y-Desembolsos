services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
      POSTGRES_DB: credit
    ports:
      # DB_PORT permite usar otro puerto local si 5432 está ocupado.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://credit:credit@db:5432/credit
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion}
    depends_on:
      db:
        condition: service_healthy
    # Solo visible dentro de la red de Docker: el único punto de entrada es el frontend.
    expose:
      - "3000"
    healthcheck:
      # /health responde cuando la migración terminó y el servidor ya escucha.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
