server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Healthcheck del backend, accesible para diagnóstico desde el mismo origen.
  location = /health {
    proxy_pass http://backend:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 5s;
  }

  # API: se proxea al backend. La consulta al buró puede tardar (reintentos), por eso 60 s.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  # El servicio simulado del buró es interno: nunca se expone al navegador.
  location /internal/ {
    return 404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta devuelve index.html
  location / {
    try_files $uri /index.html;
  }
}